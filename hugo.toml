baseURL = "https://hadibaba.com/"
languageCode = "tr"
defaultContentLanguage = "tr"
title = "Hadi Baba"
timeZone = "Europe/Istanbul"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 10

[taxonomies]
  kategori = "kategoriler"

[permalinks]
  [permalinks.page]
    posts = "/:year/:month/:contentbasename/"

[params]
  slogan = "Coşkunun adresi. Yaparız baba!"
  description = "Türk futbolunu coşkuyla yorumlayan site. Takım tutmayız, futbola âşığız."
  # Tema renkleri: iki site aynı iskeleti, farklı renklerle kullanır
  accent = "#e4572e"
  accentInk = "#ffffff"
  # Paylaşım kartındaki kategori etiketinin rengi (layouts/partials/kart.html)
  kartEtiket = "#ffd9cc"
  # Sahnedeki rakip
  rivalName = "Yürü Baba"
  rivalURL = "https://yurubaba.com/"
  rivalJab = "Keyif kaçırıcılar için:"
  # Canlı skor / puan durumu veri adresi (skor-api/ Vercel projesi). Boşsa "çok yakında".
  skorAPI = ""

  # Ziyaretçi sayacı (GoatCounter): https://hadibaba.goatcounter.com — boş bırakılırsa sayaç kapanır.
  goatcounter = "hadibaba"

  closingQuestion = "Siz ne diyorsunuz? Yorumlara yazın!"

  # Yorumlar (Waline, kendi sunucumuz; iki site ortak).
  # serverURL boş bırakılırsa yazılarda "Yorum köşesi çok yakında" görünür.
  [params.waline]
    serverURL = "https://yorum.hadibaba.com"
    placeholder = "Yaz bakalım, coşkunu paylaş! Yaparız baba!"

  # Sosyal medya (başlıkta her sayfada görünür; partials/header.html)
  [[params.sosyal]]
    ad = "Instagram"
    url = "https://www.instagram.com/hadibabacom/"
  [[params.sosyal]]
    ad = "Threads"
    url = "https://www.threads.com/@hadibabacom"
  [[params.sosyal]]
    ad = "Facebook"
    url = "https://www.facebook.com/1445671885292077"
  [[params.sosyal]]
    ad = "Bluesky"
    url = "https://bsky.app/profile/hadibaba.bsky.social"
  [[params.sosyal]]
    ad = "Telegram"
    url = "https://t.me/hadibabacom"

[menus]
  [[menus.main]]
    name = "Canlı Skor"
    url = "/canli/"
    weight = -1
  [[menus.main]]
    name = "Maç Önü"
    url = "/kategoriler/mac-onu/"
    weight = 1
  [[menus.main]]
    name = "Maç Sonu"
    url = "/kategoriler/mac-sonu/"
    weight = 2
  [[menus.main]]
    name = "Transfer Kulisi"
    url = "/kategoriler/transfer-kulisi/"
    weight = 3
  [[menus.main]]
    name = "Yürü'ye Cevap"
    url = "/kategoriler/yuruye-cevap/"
    weight = 4
  [[menus.main]]
    name = "Hakkında"
    url = "/hakkinda/"
    weight = 5

[markup.goldmark.renderer]
  unsafe = false
