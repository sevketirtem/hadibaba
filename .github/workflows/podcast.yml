# Günlük "Hadi vs Yürü" podcast'i: podcast/senaryolar/<tarih>.json push edilince
# ses (Gemini TTS) + sahne görselleri (Gemini) + YouTube videosu üretir, sesi GitHub Releases'a koyar,
# RSS beslemesini (hadibaba.com/podcast/feed.xml) günceller → Spotify/Apple beslemeden kendisi çeker.
# YouTube'a yükleme YOUTUBE_* secret'ları varsa yapılır.
name: Podcast

on:
  push:
    branches: [main]
    paths: ["podcast/senaryolar/**"]
  workflow_dispatch:
    inputs:
      tarih:
        description: "Senaryo tarihi (YYYY-AA-GG; boş = en yeni)"
        type: string
        default: ""
      yeniden:
        description: "Bölüm zaten varsa yeniden üret"
        type: boolean
        default: false
      sadece_youtube:
        description: "Yalnızca var olan bölümün videosunu YouTube'a yükle"
        type: boolean
        default: false
      sadece_kesit:
        description: "Yalnızca var olan bölümden dikey kesit üret ve paylaş (Shorts/TikTok)"
        type: boolean
        default: false
      kesit_deneme:
        description: "Kesit denemesi: paylaşma, kesit-deneme dalına koy"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  bolum:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Senaryoyu seç
        id: sec
        run: |
          if [ -n "${{ inputs.tarih }}" ]; then t="${{ inputs.tarih }}"; else
            t=$(ls podcast/senaryolar/*.json | xargs -n1 basename | sed 's/\.json$//' | sort | tail -1); fi
          f="podcast/senaryolar/$t.json"
          [ -f "$f" ] || f="podcast/denemeler/$t.json"
          [ -f "$f" ] || { echo "::error::Senaryo yok: $t"; exit 1; }
          echo "tarih=$t" >> "$GITHUB_OUTPUT"; echo "dosya=$f" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.sadece_kesit }}" = "true" ] || [ "${{ inputs.sadece_youtube }}" = "true" ]; then
            echo "uret=false" >> "$GITHUB_OUTPUT"
          elif grep -q "\"tarih\": \"$t\"" podcast/bolumler.json 2>/dev/null && [ "${{ inputs.yeniden }}" != "true" ]; then
            echo "uret=false" >> "$GITHUB_OUTPUT"; echo "::notice title=Podcast::$t zaten var"; else echo "uret=true" >> "$GITHUB_OUTPUT"; fi

      - name: Araçları kur
        if: steps.sec.outputs.uret == 'true' || inputs.sadece_kesit
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          fc-list | grep -q DejaVuSans-Bold || sudo apt-get install -y -qq fonts-dejavu-core
          pip install -q pillow faster-whisper

      - name: Whisper modeli önbelleği
        if: steps.sec.outputs.uret == 'true' || inputs.sadece_kesit
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Seslendir (Gemini TTS)
        if: steps.sec.outputs.uret == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          mkdir -p /tmp/b
          python scripts/podcast_ses.py "${{ steps.sec.outputs.dosya }}" /tmp/b/ses.mp3 gemini \
            || python scripts/podcast_ses.py "${{ steps.sec.outputs.dosya }}" /tmp/b/ses.mp3 google

      - name: Sahne görselleri (Gemini)
        if: steps.sec.outputs.uret == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gemini_gorsel.py gorsel "[
            {\"cikti\":\"/tmp/b/hadi.png\",\"kim\":\"hadi\",\"en_boy\":\"1:1\",\"istem\":\"Hadi Baba bir podcast mikrofonunun başında coşkuyla, gülerek konuşuyor; yakın plan, yüz büyük ve net, karenin ortasında.\"},
            {\"cikti\":\"/tmp/b/yuru.png\",\"kim\":\"yuru\",\"en_boy\":\"1:1\",\"istem\":\"Yürü Baba bir podcast mikrofonunun başında tek kaşı kalkık, alaycı gülümsüyor; yakın plan, yüz büyük ve net, karenin ortasında.\"}
          ]"

      - name: Video
        if: steps.sec.outputs.uret == 'true'
        run: python scripts/podcast_video.py "${{ steps.sec.outputs.dosya }}" /tmp/b/ses.mp3 /tmp/b/video.mp4 /tmp/b/hadi.png /tmp/b/yuru.png

      - name: Sesi Releases'a koy, RSS'i güncelle
        if: steps.sec.outputs.uret == 'true'
        run: |
          t="${{ steps.sec.outputs.tarih }}"; etiket="podcast-$t"
          cp /tmp/b/ses.mp3 "/tmp/b/hadi-vs-yuru-$t.mp3"; cp /tmp/b/video.mp4 "/tmp/b/hadi-vs-yuru-$t.mp4"
          gh release delete "$etiket" -y --cleanup-tag 2>/dev/null || true
          gh release create "$etiket" "/tmp/b/hadi-vs-yuru-$t.mp3" "/tmp/b/hadi-vs-yuru-$t.mp4" \
            --title "Hadi vs Yürü — $t" --notes "Podcast bölümü $t"
          python3 - "$t" "${{ steps.sec.outputs.dosya }}" <<'PY'
          import json, os, subprocess, sys, datetime as dt
          t, dosya = sys.argv[1], sys.argv[2]
          s = json.load(open(dosya, encoding="utf-8"))
          yol = "podcast/bolumler.json"
          liste = json.load(open(yol, encoding="utf-8")) if os.path.exists(yol) else []
          liste = [b for b in liste if b["tarih"] != t]
          mp3 = f"/tmp/b/hadi-vs-yuru-{t}.mp3"
          sure = float(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", mp3],
                                      capture_output=True, text=True).stdout or 0)
          repo = os.environ["GITHUB_REPOSITORY"]
          liste.append({"tarih": t, "no": len(liste) + 1, "baslik": s["baslik"], "aciklama": s["aciklama"],
                        "yazilar": s.get("yazilar", {}),
                        "yayin": dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
                        "ses_url": f"https://github.com/{repo}/releases/download/podcast-{t}/hadi-vs-yuru-{t}.mp3",
                        "video_url": f"https://github.com/{repo}/releases/download/podcast-{t}/hadi-vs-yuru-{t}.mp4",
                        "boyut": os.path.getsize(mp3), "sure": round(sure)})
          liste.sort(key=lambda b: b["tarih"])
          for i, b in enumerate(liste, 1):
              b["no"] = i
          json.dump(liste, open(yol, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(f"::notice title=Podcast bölümü::{t} — {s['baslik']} ({round(sure)} sn)")
          PY
          python3 scripts/podcast_rss.py
          git config user.name "Claude (Hadi-Yürü ekibi)"; git config user.email "noreply@anthropic.com"
          git add podcast/bolumler.json static/podcast/feed.xml
          git commit -qm "Podcast: $t" && git pull -q --rebase --autostash origin main && git push -q origin main
          gh workflow run hugo.yml --ref main

      - name: Var olan videoyu indir (yalnızca YouTube)
        if: inputs.sadece_youtube
        run: |
          mkdir -p /tmp/b
          gh release download "podcast-${{ steps.sec.outputs.tarih }}" -p "*.mp4" -O /tmp/b/video.mp4

      - name: YouTube'a yükle
        if: steps.sec.outputs.uret == 'true' || inputs.sadece_youtube
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          [ -n "$YOUTUBE_REFRESH_TOKEN" ] || { echo "::notice title=YouTube::anahtar yok, yükleme atlandı"; exit 0; }
          YOUTUBE_ID_DOSYA=/tmp/b/youtube_id python scripts/youtube_yukle.py "${{ steps.sec.outputs.dosya }}" /tmp/b/video.mp4

      # ---- Dikey kesit (en komik 40–60 sn) → YouTube Shorts + TikTok
      - name: Var olan bölümün sesini indir (yalnızca kesit)
        if: inputs.sadece_kesit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/b
          gh release download "podcast-${{ steps.sec.outputs.tarih }}" -p "*.mp3" -O /tmp/b/ses.mp3

      - name: Kesit üret
        id: kesit
        if: steps.sec.outputs.uret == 'true' || inputs.sadece_kesit
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TIKTOK_VAR: ${{ secrets.TIKTOK_REFRESH_TOKEN != '' }}
        run: |
          [ "$TIKTOK_VAR" = "true" ] && export KESIT_SADE_CIKTI=/tmp/b/kesit-tiktok.mp4
          python scripts/podcast_kesit.py "${{ steps.sec.outputs.dosya }}" /tmp/b/ses.mp3 /tmp/b/kesit.mp4 /tmp/b/hadi.png /tmp/b/yuru.png
          t="${{ steps.sec.outputs.tarih }}"
          if [ "${{ inputs.kesit_deneme }}" = "true" ]; then
            mkdir -p /tmp/d && cp /tmp/b/kesit.mp4 /tmp/b/kesit.json /tmp/d/ && cd /tmp/d && git init -q && git checkout -q -b kesit-deneme
            git config user.name "Claude (Hadi-Yürü ekibi)" && git config user.email "noreply@anthropic.com"
            git add . && git commit -qm "Kesit denemesi $t"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kesit-deneme
            echo "::notice title=Kesit denemesi::kesit-deneme dalına kondu"
          else
            cp /tmp/b/kesit.mp4 "/tmp/b/hadi-vs-yuru-$t-kesit.mp4"
            gh release upload "podcast-$t" "/tmp/b/hadi-vs-yuru-$t-kesit.mp4" --clobber
          fi

      - name: Kesiti paylaş
        if: steps.kesit.outcome == 'success' && !inputs.kesit_deneme
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          python scripts/kesit_paylas.py "${{ steps.sec.outputs.dosya }}" /tmp/b/kesit.mp4 /tmp/b/kesit.json "$(cat /tmp/b/youtube_id 2>/dev/null)"

      - name: Kesit kaydını sakla
        if: always() && steps.kesit.outcome == 'success' && !inputs.kesit_deneme
        run: |
          git config user.name "Claude (Hadi-Yürü ekibi)"; git config user.email "noreply@anthropic.com"
          git add podcast/kesit_kayit.txt 2>/dev/null || exit 0
          git commit -qm "Kesit paylaşım kaydı ${{ steps.sec.outputs.tarih }}" || exit 0
          git pull -q --rebase --autostash origin main && git push -q origin main
