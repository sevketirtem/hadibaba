# Vertex AI bağlantı denemesi (Workload Identity Federation, anahtarsız). Deneme kredisi bu yoldan harcanır.
name: Vertex deneme
on:
  workflow_dispatch:
    inputs:
      omni: {description: "Küçük bir Omni (360p, 3 sn) denemesi de yapılsın mı", type: boolean, default: false}
permissions:
  contents: read
  id-token: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1001418254189/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: vertex-github@hadi-yuru-ses.iam.gserviceaccount.com
          token_format: access_token
      - name: Dene
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          OMNI: ${{ inputs.omni }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          T = os.environ["TOKEN"]; P = "hadi-yuru-ses"
          def c(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None,
                  method="POST" if body is not None else "GET",
                  headers={"Authorization": f"Bearer {T}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=300) as r: return r.status, r.read()[:1500].decode("utf-8","replace")
              except urllib.error.HTTPError as e: return e.code, e.read()[:700].decode("utf-8","replace")
          metin = {"contents":[{"role":"user","parts":[{"text":"Tek kelimeyle cevap ver: Merhaba?"}]}]}
          for m in ("gemini-3.8-flash", "gemini-3.5-flash", "gemini-2.5-flash"):
              for host, loc in (("aiplatform.googleapis.com","global"), ("europe-west4-aiplatform.googleapis.com","europe-west4")):
                  s, b = c(f"https://{host}/v1/projects/{P}/locations/{loc}/publishers/google/models/{m}:generateContent", metin)
                  print(f"::notice title=Metin {m} {loc}::{s} {b[:300]}")
                  if s == 200: break
          for yol in ("v1beta1/projects/%s/locations/global/interactions" % P, "v1/projects/%s/locations/global/interactions" % P):
              s, b = c(f"https://aiplatform.googleapis.com/{yol}", {"model": "lyria-3-clip-preview", "input": "Short happy stadium drum loop, instrumental"} if os.environ["OMNI"] != "true" else
                       {"model": "gemini-omni-1.1-flash", "input": "A football rolling slowly on wet grass at night, plain, no text", "response_format": {"type": "video", "resolution": "360p", "aspect_ratio": "16:9"}})
              print(f"::notice title=Interactions {yol.split('/')[0]}::{s} {b[:400]}")
          s, b = c(f"https://aiplatform.googleapis.com/v1beta1/publishers/google/models?pageSize=200")
          print(f"::notice title=Model listesi::{s} {b[:1200]}")
          PY
