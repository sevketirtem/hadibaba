# Vertex AI bağlantı denemesi (Workload Identity Federation, anahtarsız). Deneme kredisi bu yoldan harcanır.
name: Vertex deneme
on:
  workflow_dispatch:
    inputs:
      omni: {description: "Küçük bir Omni (360p, 3 sn) denemesi de yapılsın mı", type: boolean, default: false}
permissions:
  contents: read
  id-token: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1001418254189/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: vertex-github@hadi-yuru-ses.iam.gserviceaccount.com
          token_format: access_token
      - name: Dene
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          OMNI: ${{ inputs.omni }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          T = os.environ["TOKEN"]; P = "hadi-yuru-ses"
          def c(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None,
                  method="POST" if body is not None else "GET",
                  headers={"Authorization": f"Bearer {T}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=300) as r: return r.status, r.read()[:1500].decode("utf-8","replace")
              except urllib.error.HTTPError as e: return e.code, e.read()[:700].decode("utf-8","replace")
          import base64
          s, b = c(f"https://aiplatform.googleapis.com/v1beta1/publishers/google/models?pageSize=300")
          try:
              adlar = [m["name"].split("/")[-1] for m in json.loads(b).get("publisherModels", [])]
          except Exception: adlar = []
          print("::notice title=Video/müzik modelleri::" + ", ".join(a for a in adlar if any(k in a for k in ("omni","veo","lyria","imagen","image","tts"))))
          resim = base64.b64encode(open("video/tezahurat/baslangic.jpg","rb").read()).decode()
          for m in ("gemini-omni-1.1-flash", "veo-3.1-fast-generate-001", "veo-3.1-fast-generate-preview", "veo-3.0-fast-generate-001"):
              govde = {"instances":[{"prompt":"A football rolling slowly on wet grass at night, no text","image":{"bytesBase64Encoded":resim,"mimeType":"image/jpeg"}}],
                       "parameters":{"aspectRatio":"16:9","sampleCount":1,"durationSeconds":4,"resolution":"720p","generateAudio":False}}
              if os.environ["OMNI"] != "true": govde = {"instances":[{"prompt":"x"}],"parameters":{"sampleCount":0}}
              s, b = c(f"https://aiplatform.googleapis.com/v1/projects/{P}/locations/us-central1/publishers/google/models/{m}:predictLongRunning".replace("aiplatform.googleapis.com/v1/projects/hadi-yuru-ses/locations/us-central1","us-central1-aiplatform.googleapis.com/v1/projects/hadi-yuru-ses/locations/us-central1"), govde)
              print(f"::notice title=predictLongRunning {m}::{s} {b[:300]}")
              s, b = c(f"https://aiplatform.googleapis.com/v1/projects/{P}/locations/global/publishers/google/models/{m}:generateContent", {"contents":[{"role":"user","parts":[{"text":"A ball rolling, 3 second video"}]}]} )
              print(f"::notice title=generateContent {m}::{s} {b[:300]}")
          PY
