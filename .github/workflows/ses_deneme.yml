name: Ses denemesi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deneme:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q piper-tts
      - name: Türkçe sesleri indir ve dene
        run: |
          mkdir -p out
          liste=$(curl -sfL "https://huggingface.co/api/models/rhasspy/piper-voices/tree/main/tr/tr_TR" | python -c "import sys,json;print(' '.join(x['path'] for x in json.load(sys.stdin)))")
          echo "::notice title=tr klasoru::$liste"
          for d in $liste; do
            k=${d##*/}
            for q in $(curl -sfL "https://huggingface.co/api/models/rhasspy/piper-voices/tree/main/$d" | python -c "import sys,json;print(' '.join(x['path'].split('/')[-1] for x in json.load(sys.stdin)))"); do
            v=tr_TR-$k-$q
            base=https://huggingface.co/rhasspy/piper-voices/resolve/main/$d/$q
            curl -sfL -o $v.onnx $base/$v.onnx && curl -sfL -o $v.onnx.json $base/$v.onnx.json || { echo "::warning::$v indirilemedi"; continue; }
            lic=$(curl -sfL $base/MODEL_CARD | grep -i -A2 -E 'licen|dataset' | tr '\n' ' ' | cut -c1-400)
            echo "::notice title=$v::$lic"
            echo "Bu hafta şampiyon Beşiktaş! Pazar Kasımpaşa'da bir iki alırız!" | python -m piper -m $v.onnx -f out/${k}_hadi.wav --length-scale 0.9
            echo "Geçen hafta Trabzonspor'du. Sende şampiyonluk haftalık abonelik." | python -m piper -m $v.onnx -f out/${k}_yuru.wav --length-scale 1.1
            done
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: sesler
          path: out/
