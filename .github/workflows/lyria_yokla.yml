# Geçici: Lyria istem filtresi hangi parçaya takılıyor? (yalnızca gönderim kabul/ret; kabul edilen üretim beklenmez)
name: Lyria yokla
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: vx
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1001418254189/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: vertex-github@hadi-yuru-ses.iam.gserviceaccount.com
          token_format: access_token
      - run: pip install -q pillow numpy
      - env:
          T: ${{ steps.vx.outputs.access_token }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          sys.path.insert(0, "scripts")
          import aytis
          b = json.load(open("video/aytis/ornek.json", encoding="utf-8"))
          tam = aytis.istem(b)
          talimat, sozler = tam.split("\n\n", 1)
          deneme = {"talimat": talimat}
          for i, k in enumerate(b["kitalar"]):
              for j, s in enumerate(k["satirlar"]):
                  deneme[f"k{i}s{j}"] = "Folk song with dombra. Lyrics:\n" + s
          deneme["nakarat"] = "Folk song with dombra. Lyrics:\n" + "\n".join(b["nakarat"])
          url = "https://aiplatform.googleapis.com/v1beta1/projects/hadi-yuru-ses/locations/global/interactions"
          for ad, metin in deneme.items():
              req = urllib.request.Request(url, data=json.dumps({"model": "lyria-3-clip-preview", "input": [{"type": "text", "text": metin}]}).encode(),
                    headers={"Authorization": "Bearer " + os.environ["T"], "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=120).read(); s = "KABUL"
              except urllib.error.HTTPError as e:
                  s = f"RET {e.code} {e.read()[:120].decode('utf-8','replace')}"
              print(f"::notice title=Yokla {ad}::{s} | {metin[-80:]}")
          PY
